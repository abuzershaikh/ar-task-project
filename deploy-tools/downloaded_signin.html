<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="signin-header">
        <div class="sign-header-left">
            <a href="/" class="logo-link signin-logo">
                <span>Reviews</span>Gateway
            </a>
        </div>

        <div class="header-right">

            <a href="/account/signup/" class="navbar-btn" aria-label="Book a free audit">
                GET STARTED FREE
                <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14" />
                    <path d="M13 5l7 7-7 7" />
                </svg>
            </a>
        </div>
    </div>

    <div class="auth-container">

        <div class="auth-card">

            <div id="error-box" class="error-box hidden">
                <span id="error-text">Something went wrong</span>
                <button id="error-close">&times;</button>
            </div>

            <div class="signin-auth-left">
                <img src="https://res.cloudinary.com/dytdjjw4r/image/upload/q_auto/f_auto/v1776554826/undraw_happy-announcement_23nf_hlcqir.svg"
                    alt="illustration">

                <h1 class="auth-title">Welcome back</h1>
                <p class="auth-sub">Let’s get you signed in</p>
            </div>

            <div class="main-form-signin">
                <form class="signup-form" onsubmit="event.preventDefault(); login();">

                    <div class="input-group">
                        <input id="email" type="email" placeholder="Email address">
                        <small class="error-msg"></small>
                    </div>

                    <div class="input-group">
                        <input id="password" type="password" placeholder="Password">
                        <small class="error-msg"></small>
                    </div>

                    <button type="submit" class="submit-btn">
                        Login
                    </button>

                </form>

                <div class="divider-signup">
                    <span>or continue with</span>
                </div>

                <button class="google-btn" id="googleBtn">
                    <img
                        src="https://res.cloudinary.com/dytdjjw4r/image/upload/v1776694476/google-icon-logo-svgrepo-com_pg842v.svg">
                    <span class="btn-text">Sign in with Google</span>
                    <span class="spinner"></span>
                </button>

                <p class="auth-footer">
                    New to ReviewsGateway?
                    <a href="/account/signup">Sign up</a>
                </p>

            </div>
        </div> 

    </div> 


    <script type="module" src="/assetes/js/firebase-auth.js"></script>
