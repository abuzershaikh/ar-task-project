<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="signin-header">
        <div class="sign-header-left">
            <a href="/" class="logo-link signin-logo">
                <span>Reviews</span>Gateway
            </a>
        </div>

        <div class="header-right">

            <a href="/account/signin/" class="navbar-btn" aria-label="Book a free audit">
                Sign in
                <svg class="btn-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M5 12h14" />
                    <path d="M13 5l7 7-7 7" />
                </svg>
            </a>
        </div>
    </div>

    <div class="auth-container">

        <div class="auth-card">
            <div id="error-box" class="error-box hidden">
                <span id="error-text">Something went wrong</span>
                <button id="error-close">&times;</button>
            </div>

            <div class="signin-auth-left">
                <img src="https://res.cloudinary.com/dytdjjw4r/image/upload/v1776694911/undraw_details_sgb2_xjqxcq.svg"
                    alt="illustration">

                <h1 class="auth-title">Create account</h1>
                <p class="auth-sub">Start exploring real reviews</p>
            </div>
            <div class="main-form-signin">

                <!-- Manual Signup FIRST -->
                <form class="signup-form" onsubmit="event.preventDefault(); signup();">

                    <div class="input-group">
                        <input id="email" type="email" placeholder="Email address"> <!-- email input -->
                        <small class="error-msg"></small>
                    </div>

                    <div class="input-group">
                        <input id="password" type="password" placeholder="Password"> <!-- password input -->
                        <small class="error-msg"></small>
                    </div>

                    <button type="submit" class="submit-btn">
                        Create account
                    </button>

                </form>

                <!-- Divider -->
                <div class="divider-signup">
                    <span>or continue with</span>
                </div>

                <!-- Google AFTER -->
                <button class="google-btn" id="googleBtn">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg">
                    Sign up with Google
                </button>

                <p class="auth-footer">
                    Already have an account?
                    <a href="/account/signin">Sign in</a>
                </p>

            </div>
        </div>

    </div>
    <script type="module" src="/assetes/js/firebase-auth.js"></script>

</body>
