  <!-- Shadow -->
  <path d="M 16 20 C 80 14, 200 18, 318 16 C 328 18, 334 26, 332 38 C 335 90, 330 170, 324 210 C 318 224, 308 230, 280 232 C 180 236, 80 232, 22 230 C 10 226, 6 214, 8 198 C 6 140, 8 60, 12 30 C 12 24, 14 22, 16 20 Z" 
