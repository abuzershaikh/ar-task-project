  <path d="M 20 86 C 110 80, 220 84, 314 82" stroke="#481F05" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 24 140 C 100 144, 220 138, 312 142" stroke="#3D1802" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.35"/>
  <path d="M 20 196 C 90 192, 200 198, 308 194" stroke="#E08B48" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Iron Nails -->
