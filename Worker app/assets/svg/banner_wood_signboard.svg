<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="100%">
  <defs>
    <linearGradient id="sbWoodMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C5422"/>
      <stop offset="20%" stop-color="#B86C32"/>
      <stop offset="65%" stop-color="#73350F"/>
      <stop offset="100%" stop-color="#4A1E06"/>
    </linearGradient>
    <linearGradient id="sbWoodEdge" x1="0%" y1="0%" x2="0%" y2="100%">
