<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Amethyst Main Gradient -->
    <linearGradient id="amMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="22%" stop-color="#6B21A8"/>
      <stop offset="65%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <!-- Amethyst Base Bevel Bottom Planks -->
    <linearGradient id="amBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3B0764"/>
      <stop offset="100%" stop-color="#1E0438"/>
    </linearGradient>

    <linearGradient id="amInnerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E0336" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#3B0764" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#140224" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Crystal Shimmer Lines -->
    <linearGradient id="amShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#F0ABFC" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#D8B4FE" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7E22CE" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Glowing Magenta/Violet Rim -->
    <linearGradient id="amVioletRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#F472B6" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#E879F9" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Faceted Crystal Gradients -->
    <linearGradient id="gemLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="50%" stop-color="#E879F9"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="gemMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#581C87"/>
    </linearGradient>
    <linearGradient id="gemDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7E22CE"/>
      <stop offset="100%" stop-color="#2E1065"/>
    </linearGradient>

    <!-- Foliage Gradients -->
    <linearGradient id="amLeafG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
    <linearGradient id="amLeafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadow -->
  <path d="M 28 22 
           C 120 18, 250 24, 380 20 
           C 510 16, 680 22, 820 18 
           C 910 16, 965 20, 976 34 
           C 986 52, 982 180, 974 218 
           C 968 244, 955 258, 930 262 
           C 820 266, 640 262, 500 265 
           C 360 268, 180 263, 72 265 
           C 38 262, 22 248, 16 220 
           C 10 178, 14 62, 20 36 
           C 22 28, 25 24, 28 22 Z" 
        fill="#000000" opacity="0.55" transform="translate(0, 7)"/>

  <!-- 2. Bottom Obsidian Foundation Slab -->
  <path d="M 40 228 
           C 180 224, 450 227, 600 225 
           C 750 223, 900 226, 960 228 
           L 968 252 
           C 930 264, 780 266, 520 266 
           C 280 266, 110 264, 32 252 Z" 
        fill="url(#amBevel)" stroke="#190326" stroke-width="2.5"/>

  <!-- Foundation Stone Seams -->
  <path d="M 220 230 L 225 264 M 460 228 L 465 265 M 710 229 L 715 264 M 860 230 L 863 260" 
        stroke="#12021B" stroke-width="3" opacity="0.75"/>

  <!-- 3. Decorative Leaves & Crystals (Behind) -->
  <!-- Top Left Leaves -->
  <path d="M 12 40 C 2 24, 18 10, 36 18 C 42 28, 30 46, 18 42 Z" fill="url(#amLeafDark)" stroke="#0E3802" stroke-width="1.5"/>
  <path d="M 28 22 C 22 8, 42 2, 58 10 C 62 24, 48 34, 34 30 Z" fill="url(#amLeafG)" stroke="#0E3802" stroke-width="1.5"/>
  <!-- Top Right Foliage -->
  <path d="M 940 24 C 956 12, 976 22, 968 38 C 954 48, 936 38, 940 24 Z" fill="url(#amLeafG)" stroke="#0E3802" stroke-width="1.5"/>
  <!-- Bottom Right Foliage -->
  <path d="M 952 214 C 970 208, 988 226, 978 244 C 962 254, 946 238, 952 214 Z" fill="url(#amLeafG)" stroke="#0E3802" stroke-width="1.5"/>

  <!-- 4. Main Obsidian / Amethyst Slab Body -->
  <path d="M 30 18 
           C 120 14, 240 20, 370 16 
           C 500 12, 670 18, 810 14 
           C 900 12, 955 16, 968 28 
           C 978 44, 974 165, 968 208 
           C 962 228, 946 238, 922 242 
           C 810 246, 630 242, 490 245 
           C 350 248, 170 243, 68 245 
           C 36 242, 22 228, 18 204 
           C 12 165, 16 52, 22 30 
           C 24 22, 27 19, 30 18 Z" 
        fill="url(#amMain)" stroke="#24053B" stroke-width="4.5"/>

  <!-- 5. Inner Amethyst Vignette -->
  <path d="M 34 22 
           C 120 18, 240 24, 370 20 
           C 500 16, 670 22, 810 18 
           C 900 16, 950 20, 962 30 
           C 972 46, 968 162, 962 204 
           C 956 222, 942 232, 918 236 
           C 810 240, 630 236, 490 239 
           C 350 242, 170 237, 72 239 
           C 42 236, 28 222, 24 200 
           C 18 162, 22 56, 26 34 Z" 
        fill="url(#amInnerShadow)"/>

  <!-- 6. Glowing Violet Rim Highlight -->
  <path d="M 32 20 
           C 120 16, 240 22, 370 18 
           C 500 14, 670 20, 810 16 
           C 900 14, 952 18, 964 28" 
        stroke="url(#amVioletRim)" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- 7. Crystal Vein Shimmer Lines -->
  <path d="M 40 42 C 180 34, 420 40, 650 36 C 800 34, 920 42, 955 40" stroke="url(#amShimmer)" stroke-width="2.2" stroke-linecap="round" fill="none"/>
  <path d="M 36 78 C 220 72, 520 78, 780 74 C 890 72, 945 78, 958 76" stroke="#3B0764" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M 38 128 C 260 122, 580 128, 820 124 C 900 122, 950 128, 956 126" stroke="#25053D" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.55"/>
  <path d="M 36 178 C 210 184, 500 180, 750 184 C 870 182, 940 178, 955 180" stroke="#581C87" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M 42 226 C 240 222, 540 226, 780 224 C 880 222, 930 226, 945 224" stroke="url(#amShimmer)" stroke-width="1.8" stroke-linecap="round" fill="none"/>

  <!-- 8. Glowing Amethyst Crystal Cluster on Bottom-Left & Corner -->
  <!-- Large Crystal 1 -->
  <g id="crystal-cluster" transform="translate(6, 175)">
    <!-- Shadow -->
    <polygon points="18,50 32,15 48,22 42,65 24,70" fill="#000000" opacity="0.4" transform="translate(0, 4)"/>
    <!-- Main Facets -->
    <polygon points="20,50 34,14 44,48 28,68" fill="url(#gemMid)" stroke="#3B0764" stroke-width="1"/>
    <polygon points="34,14 48,22 52,52 44,48" fill="url(#gemDark)" stroke="#3B0764" stroke-width="1"/>
    <polygon points="20,50 34,14 28,68" fill="url(#gemLight)" opacity="0.85"/>
    <line x1="34" y1="14" x2="28" y2="68" stroke="#FFFFFF" stroke-width="1.2" opacity="0.8"/>

    <!-- Small Crystal 2 -->
    <polygon points="42,56 56,32 64,40 58,68 46,72" fill="url(#gemMid)" stroke="#3B0764" stroke-width="1"/>
    <polygon points="42,56 56,32 46,72" fill="url(#gemLight)" opacity="0.75"/>

    <!-- Small Crystal 3 (Left) -->
    <polygon points="8,58 18,36 28,46 22,72 10,72" fill="url(#gemDark)" stroke="#3B0764" stroke-width="1"/>
    <polygon points="8,58 18,36 10,72" fill="url(#gemLight)" opacity="0.7"/>

    <!-- Sparkle star on top of crystal -->
    <circle cx="34" cy="14" r="2.5" fill="#FFFFFF"/>
    <line x1="34" y1="8" x2="34" y2="20" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="28" y1="14" x2="40" y2="14" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Corner Amethyst Crystal Studs -->
  <circle cx="36" cy="34" r="4.2" fill="#1E0438" stroke="#C084FC" stroke-width="1.5"/>
  <circle cx="35" cy="33" r="1.5" fill="#F5D0FE" opacity="0.95"/>
  <circle cx="956" cy="34" r="4.2" fill="#1E0438" stroke="#C084FC" stroke-width="1.5"/>
  <circle cx="955" cy="33" r="1.5" fill="#F5D0FE" opacity="0.95"/>
  <circle cx="954" cy="228" r="4.2" fill="#1E0438" stroke="#C084FC" stroke-width="1.5"/>
  <circle cx="953" cy="227" r="1.5" fill="#F5D0FE" opacity="0.95"/>

  <!-- Foreground Sprout Wrapping Crystal -->
  <path d="M 68 238 C 76 250, 92 246, 86 234 C 80 230, 72 232, 68 238 Z" fill="url(#amLeafG)" stroke="#0E3802" stroke-width="1.2"/>
</svg>
