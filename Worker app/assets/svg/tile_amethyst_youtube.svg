<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 380" width="100%" height="100%">
  <defs>
    <!-- Amethyst Stone Base -->
    <linearGradient id="amStoneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9D5FF"/>
      <stop offset="40%" stop-color="#C084FC"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </linearGradient>

    <!-- YouTube Red -->
    <linearGradient id="ytRedGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF3838"/>
      <stop offset="50%" stop-color="#E60000"/>
      <stop offset="100%" stop-color="#990000"/>
    </linearGradient>

    <!-- Foliage -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9FE834"/>
      <stop offset="50%" stop-color="#55B315"/>
      <stop offset="100%" stop-color="#1E6603"/>
    </linearGradient>

    <!-- Faceted Gem Gradients -->
    <linearGradient id="gemLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0FE"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="gemDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>

    <!-- Crown -->
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF275"/>
      <stop offset="40%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </linearGradient>
  </defs>

  <!-- JUNGLE LEAVES SHADOW -->
  <g id="leaves-shadow" opacity="0.35" transform="translate(0, 6)">
    <path d="M175 280 C195 270, 240 290, 235 320 C210 340, 175 310, 175 280 Z" fill="#000000"/>
    <path d="M195 310 C220 310, 255 340, 230 370 C200 370, 185 340, 195 310 Z" fill="#000000"/>
    <path d="M50 295 C65 330, 60 370, 25 370 C5 350, 20 310, 50 295 Z" fill="#000000"/>
  </g>

  <!-- LEAVES -->
  <g id="leaves">
    <path d="M175 280 C195 270, 240 290, 235 320 C210 340, 175 310, 175 280 Z" fill="url(#leafGrad)" stroke="#114202" stroke-width="2.5"/>
    <path d="M195 310 C220 310, 255 340, 230 370 C200 370, 185 340, 195 310 Z" fill="url(#leafGrad)" stroke="#114202" stroke-width="2.5"/>
    <path d="M50 295 C65 330, 60 370, 25 370 C5 350, 20 310, 50 295 Z" fill="url(#leafGrad)" stroke="#114202" stroke-width="2.5"/>
  </g>

  <!-- CARVED AMETHYST BLOCK SHADOW -->
  <rect x="30" y="118" width="220" height="210" rx="42" fill="#000000" opacity="0.35"/>

  <!-- CARVED AMETHYST BLOCK BASE -->
  <g id="tile-base">
    <rect x="30" y="110" width="220" height="210" rx="42" fill="url(#amStoneGrad)" stroke="#581C87" stroke-width="6"/>
    <path d="M32 180 L248 180" stroke="#7E22CE" stroke-width="4"/>
    <path d="M32 250 L248 250" stroke="#7E22CE" stroke-width="4"/>
    <path d="M125 112 L125 180" stroke="#7E22CE" stroke-width="4"/>
    <path d="M155 180 L155 250" stroke="#7E22CE" stroke-width="4"/>
    <path d="M105 250 L105 318" stroke="#7E22CE" stroke-width="4"/>
    <rect x="36" y="116" width="208" height="198" rx="36" fill="none" stroke="#F5D0FE" stroke-width="3" opacity="0.75"/>
  </g>

  <!-- AMETHYST CRYSTAL BUDS ON EDGES -->
  <polygon points="34,130 46,110 52,126 42,138" fill="url(#gemLight)" stroke="#581C87" stroke-width="1"/>
  <polygon points="230,126 242,106 248,124 238,136" fill="url(#gemLight)" stroke="#581C87" stroke-width="1"/>
  <polygon points="232,230 248,214 252,236 240,244" fill="url(#gemDark)" stroke="#581C87" stroke-width="1"/>

  <!-- PLATFORM BADGE CENTER (YouTube) -->
  <g id="yt-pill">
    <rect x="55" y="145" width="165" height="135" rx="38" fill="#7A0000"/>
    <rect x="55" y="139" width="165" height="135" rx="38" fill="url(#ytRedGrad)" stroke="#FFA3A3" stroke-width="3"/>
    <path d="M85 145 Q137 140 190 145" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <polygon points="122,181 168,210 122,239" fill="#550000" opacity="0.5"/>
    <polygon points="122,177 168,206 122,235" fill="#FFFFFF"/>
  </g>

  <!-- GOLDEN CROWN ON TOP -->
  <g id="crown">
    <path d="M40 113 C75 93, 120 88, 145 108 L140 138 C115 123, 75 123, 45 143 Z" fill="#000000" opacity="0.3"/>
    <path d="M40 110 C75 90, 120 85, 145 105 L140 135 C115 120, 75 120, 45 140 Z" fill="#944B00"/>
    <path d="M42 105 
             L 30 65 C 30 55, 45 50, 55 60 L 75 90 
             L 95 30 C 102 20, 118 20, 125 30 L 145 90 
             L 165 60 C 175 50, 190 55, 190 65 L 178 105 
             C 140 85, 80 85, 42 105 Z" 
          fill="url(#crownGrad)" stroke="#FFE875" stroke-width="3"/>
    <circle cx="38" cy="60" r="9" fill="#FFF275" stroke="#D47A00" stroke-width="2"/>
    <circle cx="110" cy="27" r="11" fill="#FFF275" stroke="#D47A00" stroke-width="2"/>
    <circle cx="182" cy="60" r="9" fill="#FFF275" stroke="#D47A00" stroke-width="2"/>
    <circle cx="110" cy="85" r="8" fill="#C084FC" stroke="#581C87" stroke-width="2"/>
  </g>
</svg>
