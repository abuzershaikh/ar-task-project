<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 150" width="100%" height="100%">
  <defs>
    <!-- Deep Outer Shadow -->
    <filter id="wbShadow" x="-10%" y="-10%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.75"/>
    </filter>

    <!-- Timber Bark Rim Gradient -->
    <linearGradient id="wbBarkRim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4E230B"/>
      <stop offset="35%" stop-color="#2E1205"/>
      <stop offset="70%" stop-color="#461E09"/>
      <stop offset="100%" stop-color="#1C0902"/>
    </linearGradient>

    <!-- Main Rich Wood Board Gradient -->
    <linearGradient id="wbWoodMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C27334"/>
      <stop offset="18%" stop-color="#9E541E"/>
      <stop offset="50%" stop-color="#7B3A0F"/>
      <stop offset="85%" stop-color="#5B2809"/>
      <stop offset="100%" stop-color="#3B1804"/>
    </linearGradient>

    <!-- Upper Plank Highlight Gradient -->
    <linearGradient id="wbPlankTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D98846"/>
      <stop offset="40%" stop-color="#AC5E24"/>
      <stop offset="100%" stop-color="#7A390E"/>
    </linearGradient>

    <!-- Sunken Recessed Display Plate -->
    <linearGradient id="wbRecessedBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180A03"/>
      <stop offset="40%" stop-color="#291206"/>
      <stop offset="80%" stop-color="#200D04"/>
      <stop offset="100%" stop-color="#120501"/>
    </linearGradient>

    <!-- Polished Gold Metallic Gradient -->
    <linearGradient id="wbGoldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="25%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="75%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Gold Edge Rim Highlight -->
    <linearGradient id="wbGoldRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Coin Radial Glow -->
    <radialGradient id="wbCoinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.45"/>
      <stop offset="75%" stop-color="#D97706" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>

    <!-- Inner Slot Bevel Shadow -->
    <linearGradient id="wbSlotShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#000000" stop-opacity="0.4"/>
      <stop offset="85%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3B1804" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Leaf Green Gradient -->
    <linearGradient id="wbLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="35%" stop-color="#22C55E"/>
      <stop offset="80%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadow under Board -->
  <path d="M 22 18 C 120 11, 380 12, 482 17 C 494 20, 498 28, 496 42 C 499 82, 495 116, 488 135 C 480 144, 465 147, 430 148 C 300 150, 100 149, 32 146 C 18 144, 12 136, 11 122 C 8 85, 10 45, 14 26 C 16 19, 18 18, 22 18 Z" 
        fill="#000000" opacity="0.6" filter="url(#wbShadow)"/>

  <!-- 2. Dark Heavy Bark Rim (Bottom 3D extrusion) -->
  <path d="M 20 16 C 120 9, 380 10, 482 15 C 494 18, 498 26, 496 40 C 499 80, 495 114, 488 133 C 480 142, 465 145, 430 146 C 300 148, 100 147, 32 144 C 18 142, 12 134, 11 120 C 8 83, 10 43, 14 24 C 16 17, 18 16, 20 16 Z" 
        fill="url(#wbBarkRim)" stroke="#170601" stroke-width="2.5"/>

  <!-- 3. Main Carved Wooden Board Body -->
  <path d="M 20 12 C 120 5, 380 6, 482 11 C 494 14, 498 22, 496 36 C 499 76, 495 110, 488 129 C 480 138, 465 141, 430 142 C 300 144, 100 143, 32 140 C 18 138, 12 130, 11 116 C 8 79, 10 39, 14 20 C 16 13, 18 12, 20 12 Z" 
        fill="url(#wbWoodMain)" stroke="#2B1003" stroke-width="3"/>

  <!-- Top Wood Bevel Edge Glint -->
  <path d="M 24 14 C 130 8, 370 9, 478 13" stroke="#FDBA74" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.75"/>

  <!-- Horizontal Chiseled Plank Seam -->
  <path d="M 13 74 C 120 70, 360 76, 496 72" stroke="#240A01" stroke-width="3.5" fill="none" opacity="0.85"/>
  <path d="M 13 76 C 120 72, 360 78, 496 74" stroke="#FDBA74" stroke-width="1.2" fill="none" opacity="0.45"/>

  <!-- Natural Wood Grains & Knots -->
  <path d="M 26 34 C 110 28, 240 32, 474 28" stroke="#3D1704" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 30 52 C 80 49, 160 54, 468 49" stroke="#E07F34" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.4"/>
  <path d="M 24 100 C 120 105, 340 98, 476 102" stroke="#341202" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.45"/>
  <path d="M 32 120 C 140 124, 330 119, 462 122" stroke="#E07F34" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.35"/>

  <!-- 4. Sunken Recessed Display Plate for Balance (Right section: x 140 to 476, y 20 to 124) -->
  <!-- Outer Gold/Brass Inlay Rim -->
  <rect x="140" y="20" width="338" height="106" rx="16" fill="none" stroke="url(#wbGoldRim)" stroke-width="2.5" opacity="0.9"/>
  <!-- Recessed Dark Timber Plate -->
  <rect x="142" y="22" width="334" height="102" rx="14" fill="url(#wbRecessedBg)" stroke="#190701" stroke-width="2.5"/>
  <!-- Deep Inner Shadow inside Recess -->
  <rect x="143" y="23" width="332" height="100" rx="13" fill="url(#wbSlotShadow)" opacity="0.9"/>

  <!-- Recessed Inner Gold Line Accent at Bottom -->
  <path d="M 154 120 L 464 120" stroke="url(#wbGoldRim)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>

  <!-- Carved "AVAILABLE BALANCE" Header Ribbon Bar on the plate -->
  <path d="M 200 24 L 416 24 C 426 24, 432 29, 428 36 L 424 43 C 422 47, 416 50, 410 50 L 206 50 C 200 50, 194 47, 192 43 L 188 36 C 184 29, 190 24, 200 24 Z" 
        fill="#260F04" stroke="url(#wbGoldRim)" stroke-width="1.2"/>
  <text x="308" y="41" font-family="Poppins, Arial, sans-serif" font-size="10.5" font-weight="800" fill="#FDE047" letter-spacing="1.8" text-anchor="middle">AVAILABLE BALANCE</text>
  <!-- Mini decorative dots on ribbon -->
  <circle cx="204" cy="37" r="2.2" fill="#FBBF24"/>
  <circle cx="412" cy="37" r="2.2" fill="#FBBF24"/>

  <!-- 5. Massive 3D Golden Medallion & Coin (Centered at x: 78, y: 73) -->
  <g transform="translate(78, 73)">
    <!-- Radial Ambient Gold Aura -->
    <circle cx="0" cy="0" r="62" fill="url(#wbCoinGlow)"/>

    <!-- Carved Wooden Socket Shadow behind Coin -->
    <circle cx="0" cy="5" r="50" fill="#0E0401" opacity="0.8"/>
    <circle cx="0" cy="0" r="50" fill="#2B1004" stroke="#150501" stroke-width="2"/>

    <!-- Outer Golden Gear/Spur Ring -->
    <circle cx="0" cy="0" r="47" fill="url(#wbGoldMetallic)" stroke="#78350F" stroke-width="2.5"/>

    <!-- Coin Edge Studs / Rivets (12 points) -->
    <circle cx="0" cy="-40" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="20" cy="-35" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="35" cy="-20" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="40" cy="0" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="35" cy="20" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="20" cy="35" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="0" cy="40" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="-20" cy="35" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="-35" cy="20" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="-40" cy="0" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="-35" cy="-20" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>
    <circle cx="-20" cy="-35" r="2.5" fill="#FEF08A" stroke="#78350F" stroke-width="0.8"/>

    <!-- Inner Coin Rim -->
    <circle cx="0" cy="0" r="34" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <circle cx="0" cy="0" r="32" fill="url(#wbGoldMetallic)"/>

    <!-- Inner Bevel Circle for Extra 3D Depth -->
    <circle cx="0" cy="0" r="28" fill="none" stroke="#FEF08A" stroke-width="1.8" opacity="0.9"/>
    <circle cx="0" cy="0" r="26" fill="#D97706" opacity="0.35"/>

    <!-- Embossed Indian Rupee (₹) Symbol in Center with 3D drop shadow -->
    <!-- Shadow -->
    <text x="1.5" y="14.5" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="900" fill="#451A03" text-anchor="middle">₹</text>
    <!-- Highlight Face -->
    <text x="0" y="13" font-family="Poppins, Arial, sans-serif" font-size="36" font-weight="900" fill="#FFFBEB" text-anchor="middle">₹</text>

    <!-- Star Glints on Coin -->
    <path d="M -24 -24 L -20 -20 L -24 -16 L -28 -20 Z" fill="#FFFFFF"/>
    <circle cx="-24" cy="-20" r="1.5" fill="#FEF08A"/>
    <path d="M 25 18 L 28 21 L 25 24 L 22 21 Z" fill="#FFFFFF"/>
  </g>

  <!-- 6. Heavy Iron Corner Brackets with Golden Rivets -->
  <!-- Top Left Bracket -->
  <g>
    <path d="M 17 22 L 38 18 C 42 18, 44 22, 42 26 L 30 38 C 26 42, 22 42, 18 38 L 14 30 C 13 26, 14 22, 17 22 Z" 
          fill="#1C0A03" stroke="url(#wbGoldRim)" stroke-width="1.5"/>
    <circle cx="26" cy="28" r="3.2" fill="#D97706" stroke="#451A03" stroke-width="1"/>
    <circle cx="25" cy="27" r="1.2" fill="#FEF08A"/>
  </g>

  <!-- Top Right Bracket -->
  <g>
    <path d="M 485 20 L 464 16 C 460 16, 458 20, 460 24 L 472 36 C 476 40, 480 40, 484 36 L 488 28 C 489 24, 488 20, 485 20 Z" 
          fill="#1C0A03" stroke="url(#wbGoldRim)" stroke-width="1.5"/>
    <circle cx="474" cy="26" r="3.2" fill="#D97706" stroke="#451A03" stroke-width="1"/>
    <circle cx="473" cy="25" r="1.2" fill="#FEF08A"/>
  </g>

  <!-- Bottom Left Bracket -->
  <g>
    <path d="M 16 118 L 19 134 C 21 138, 25 140, 31 138 L 42 134 C 46 132, 46 128, 42 124 L 30 114 C 26 110, 22 110, 18 114 Z" 
          fill="#1C0A03" stroke="url(#wbGoldRim)" stroke-width="1.5"/>
    <circle cx="28" cy="128" r="3.2" fill="#D97706" stroke="#451A03" stroke-width="1"/>
    <circle cx="27" cy="127" r="1.2" fill="#FEF08A"/>
  </g>

  <!-- Bottom Right Bracket -->
  <g>
    <path d="M 486 118 L 483 134 C 481 138, 477 140, 471 138 L 460 134 C 456 132, 456 128, 460 124 L 472 114 C 476 110, 480 110, 484 114 Z" 
          fill="#1C0A03" stroke="url(#wbGoldRim)" stroke-width="1.5"/>
    <circle cx="472" cy="128" r="3.2" fill="#D97706" stroke="#451A03" stroke-width="1"/>
    <circle cx="471" cy="127" r="1.2" fill="#FEF08A"/>
  </g>

  <!-- 7. Lush Tropical Jungle Vines & Emerald Leaves on Corners -->
  <!-- Top Right Jungle Leaves -->
  <g>
    <path d="M 470 12 C 485 4, 498 8, 496 24 C 486 26, 475 22, 470 12 Z" fill="url(#wbLeafGrad)" stroke="#064E2B" stroke-width="1.2"/>
    <path d="M 472 13 Q 484 16 492 20" stroke="#86EFAC" stroke-width="0.9" fill="none" opacity="0.8"/>

    <path d="M 486 22 C 502 24, 504 38, 492 44 C 486 36, 482 28, 486 22 Z" fill="url(#wbLeafGrad)" stroke="#064E2B" stroke-width="1.2"/>
    <path d="M 487 25 Q 493 32 493 39" stroke="#86EFAC" stroke-width="0.9" fill="none" opacity="0.8"/>
  </g>

  <!-- Bottom Right Hanging Vine Leaves -->
  <g>
    <path d="M 460 136 C 470 148, 482 148, 480 136 C 474 130, 465 130, 460 136 Z" fill="url(#wbLeafGrad)" stroke="#064E2B" stroke-width="1"/>
    <path d="M 444 140 C 452 152, 464 150, 460 140 C 454 134, 448 134, 444 140 Z" fill="url(#wbLeafGrad)" stroke="#064E2B" stroke-width="1"/>
  </g>

  <!-- Bottom Left Jungle Leaves next to Coin -->
  <g>
    <path d="M 18 132 C 12 144, 22 152, 32 144 C 28 136, 22 132, 18 132 Z" fill="url(#wbLeafGrad)" stroke="#064E2B" stroke-width="1"/>
  </g>

  <!-- Subtle Sparkling Light Dust -->
  <circle cx="160" cy="38" r="1.5" fill="#FDE047" opacity="0.8"/>
  <circle cx="452" cy="108" r="1.5" fill="#FDE047" opacity="0.8"/>
</svg>
