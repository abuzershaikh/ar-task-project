<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="100%" height="100%" preserveAspectRatio="none">
  <defs>
    <!-- Main Gradient -->
    <linearGradient id="emMain" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="20%" stop-color="#047857"/>
      <stop offset="65%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#022C22"/>
    </linearGradient>

    <!-- Base Bevel Foundation Planks -->
    <linearGradient id="emBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#011B14"/>
    </linearGradient>

    <!-- Inner Plate Shadow -->
    <linearGradient id="emInnerShadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022C22" stop-opacity="0.6"/>
      <stop offset="30%" stop-color="#064E3B" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#011812" stop-opacity="0.75"/>
    </linearGradient>

    <!-- Shimmer Highlight Line -->
    <linearGradient id="emShimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.3"/>
      <stop offset="35%" stop-color="#A7F3D0" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Outer Top Rim Glint -->
    <linearGradient id="emRim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.5"/>
      <stop offset="30%" stop-color="#6EE7B7" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#A7F3D0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Corner Accents / Foliage -->
    <linearGradient id="emLeafG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A3E635"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="emLeafDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadow -->
  <path d="M 28 22 C 120 18, 250 24, 380 20 C 510 16, 680 22, 820 18 C 910 16, 965 20, 976 34 C 986 52, 982 180, 974 218 C 968 244, 955 258, 930 262 C 820 266, 640 262, 500 265 C 360 268, 180 263, 72 265 C 38 262, 22 248, 16 220 C 10 178, 14 62, 20 36 C 22 28, 25 24, 28 22 Z" fill="#000000" opacity="0.5" transform="translate(0, 7)"/>

  <!-- 2. Bottom Shelf Foundation -->
  <path d="M 40 228 C 180 224, 450 227, 600 225 C 750 223, 900 226, 960 228 L 968 252 C 930 264, 780 266, 520 266 C 280 266, 110 264, 32 252 Z" fill="url(#emBevel)" stroke="#012018" stroke-width="2.5"/>
  <path d="M 220 230 L 225 264 M 460 228 L 465 265 M 710 229 L 715 264 M 860 230 L 863 260" stroke="#01150F" stroke-width="3" opacity="0.6"/>

  <!-- 3. Decorative Corner Accents -->
  <path d="M 12 40 C 2 24, 18 10, 36 18 C 42 28, 30 46, 18 42 Z" fill="url(#emLeafDark)" stroke="#01150F" stroke-width="1.5"/>
  <path d="M 28 22 C 22 8, 42 2, 58 10 C 62 24, 48 34, 34 30 Z" fill="url(#emLeafG)" stroke="#01150F" stroke-width="1.5"/>
  <path d="M 52 14 C 58 2, 78 4, 86 16 C 84 28, 68 32, 58 24 Z" fill="url(#emLeafG)" stroke="#01150F" stroke-width="1.5"/>
  <path d="M 940 24 C 956 12, 976 22, 968 38 C 954 48, 936 38, 940 24 Z" fill="url(#emLeafG)" stroke="#01150F" stroke-width="1.5"/>
  <path d="M 8 200 C -4 218, 8 244, 28 242 C 38 238, 36 214, 18 206 Z" fill="url(#emLeafDark)" stroke="#01150F" stroke-width="1.5"/>
  <path d="M 22 222 C 14 238, 30 260, 50 252 C 58 244, 52 226, 34 224 Z" fill="url(#emLeafG)" stroke="#01150F" stroke-width="1.5"/>
  <path d="M 952 214 C 970 208, 988 226, 978 244 C 962 254, 946 238, 952 214 Z" fill="url(#emLeafG)" stroke="#01150F" stroke-width="1.5"/>

  <!-- 4. Main Board Slab Body -->
  <path d="M 30 18 C 120 14, 240 20, 370 16 C 500 12, 670 18, 810 14 C 900 12, 955 16, 968 28 C 978 44, 974 165, 968 208 C 962 228, 946 238, 922 242 C 810 246, 630 242, 490 245 C 350 248, 170 243, 68 245 C 36 242, 22 228, 18 204 C 12 165, 16 52, 22 30 C 24 22, 27 19, 30 18 Z" fill="url(#emMain)" stroke="#012018" stroke-width="4.5"/>
  <path d="M 34 21 C 125 17, 245 23, 370 19 C 500 15, 670 21, 810 17 C 900 15, 950 19, 962 29" stroke="url(#emRim)" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>

  <!-- 5. Inner Recessed Task Plate -->
  <rect x="36" y="26" width="926" height="206" rx="16" fill="url(#emInnerShadow)" stroke="#01150F" stroke-width="1.8"/>
  <path d="M 42 36 L 956 36" stroke="url(#emShimmer)" stroke-width="1.2" stroke-linecap="round" opacity="0.5"/>
</svg>