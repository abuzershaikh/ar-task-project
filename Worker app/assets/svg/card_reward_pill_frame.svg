<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 70" width="100%" height="100%">
  <defs>
    <linearGradient id="rpPillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#693005"/>
      <stop offset="100%" stop-color="#3D1801"/>
    </linearGradient>
    <linearGradient id="rpGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF066"/>
      <stop offset="50%" stop-color="#FFB800"/>
      <stop offset="100%" stop-color="#D97700"/>
    </linearGradient>
  </defs>

  <!-- Shadow -->
  <rect x="4" y="8" width="192" height="58" rx="29" fill="#000000" opacity="0.4"/>
  <!-- Dark Wood Base -->
  <rect x="4" y="6" width="192" height="58" rx="29" fill="#2E1100"/>
  <!-- Inner Wood Gradient -->
  <rect x="4" y="3" width="192" height="56" rx="28" fill="url(#rpPillGrad)" stroke="#C77D22" stroke-width="2.5"/>

  <!-- 3D Gold Coin with Rupee -->
  <circle cx="34" cy="33" r="23" fill="#000000" opacity="0.35"/>
  <circle cx="34" cy="31" r="23" fill="#994D00"/>
  <circle cx="34" cy="29" r="23" fill="url(#rpGoldGrad)" stroke="#FFF59E" stroke-width="2"/>
  <circle cx="34" cy="29" r="18" fill="none" stroke="#B86E00" stroke-width="1.2" stroke-dasharray="3 1.5"/>

  <!-- Rupee Symbol '₹' on Coin -->
  <text x="34" y="36.5" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#693005" text-anchor="middle">₹</text>
  <text x="34" y="35" font-family="'Poppins', 'Arial Black', sans-serif" font-weight="900" font-size="20" fill="#FFF8B3" text-anchor="middle">₹</text>

  <!-- Specular shine on coin -->
  <ellipse cx="26" cy="20" rx="6" ry="2.5" fill="#FFFFFF" opacity="0.65" transform="rotate(-35 26 20)"/>
</svg>
