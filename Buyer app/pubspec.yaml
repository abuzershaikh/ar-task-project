name: marketing_pro
description: Marketing Pro - Complete Campaign Management Platform for Buyers
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4
  
  # Networking
  dio: ^5.3.3
  retrofit: ^4.0.3
  json_annotation: ^4.8.1
  dartz: ^0.10.1
  
  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  
  # UI Components
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^2.7.0
  
  # Date & Time
  intl: ^0.18.1
  timeago: ^3.6.0
  
  # Charts & Analytics
  fl_chart: ^0.64.0
  syncfusion_flutter_charts: ^23.1.44
  
  # Image Handling
  image_picker: ^1.2.3
  flutter_image_compress: ^2.3.0
  photo_view: ^0.14.0
  
  # File Handling
  file_picker: ^11.0.3
  path_provider: ^2.1.1
  open_file: ^4.0.0
  
  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.0
  
  # Notifications
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  flutter_local_notifications: ^22.3.0
  
  # Utils
  url_launcher: ^6.2.1
  share_plus: ^12.0.2
  connectivity_plus: ^7.3.1
  permission_handler: ^13.0.0
  package_info_plus: ^8.3.1
  device_info_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.6
  retrofit_generator: ^8.0.0
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/logos/

